
services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train

    env_file:
      - .env

    volumes:
      - model_data:/app/artifacts

  api:
    build:
      context: .
      dockerfile: Dockerfile.api

    ports:
      - "8000:8000"

    volumes:
      - model_data:/app/artifacts

    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  model_data:
